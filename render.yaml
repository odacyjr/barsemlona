services:
  - type: web
    name: fut-dos-cria2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_PATH
        value: /var/data/fut-dos-cria.db
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: fut-dos-cria-data
      mountPath: /var/data
      sizeGB: 1
